<div class="create-forum-page">
  <div class="create-forum-wrapper">

    <div class="create-forum-header-bar">
      <div class="create-forum-header-left">
        <i class="material-icons">add</i>
        <span>Create New Forum</span>
      </div>
    </div>

    <div class="create-forum-card">

      @if (errors.length) {
        <div class="create-forum-errors">
          @for (error of errors; track error) {
            <div class="error-item">
              <i class="material-icons">error_outline</i>
              {{ error }}
            </div>
          }
        </div>
      }

      <form #addForumForm="ngForm" (ngSubmit)="submit(addForumForm)">

        <div class="form-field">
          <label class="form-label" for="title">Forum Title</label>
          <input
            id="title"
            name="title"
            [(ngModel)]="model.title"
            class="form-input"
            placeholder="Choose a forum title"
            required />
        </div>

        <div class="form-field">
          <label class="form-label" for="description">Description</label>
          <input
            id="description"
            name="description"
            [(ngModel)]="model.description"
            class="form-input"
            placeholder="Write a brief description..."
            required />
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" [disabled]="addForumForm.invalid">
            <i class="material-icons">add</i>
            Create Forum
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
