<div class="create-screenshot-page">

  <!-- Header Bar -->
  <div class="create-screenshot-wrapper">
    <div class="create-screenshot-header-bar">
      <div class="create-screenshot-header-left">
        <i class="material-icons">add_photo_alternate</i>
        <span>New Screenshot</span>
      </div>
    </div>

    <div class="create-screenshot-card">

      <!-- Errors -->
      @if (errors.length > 0) {
        <div class="create-screenshot-errors">
          @for (e of errors; track e) {
            <div class="error-item">
              <i class="material-icons">error_outline</i>
              {{ e }}
            </div>
          }
        </div>
      }

      <form #f="ngForm" (ngSubmit)="submit(f)">

        <!-- Title -->
        <div class="form-field">
          <label class="form-label">Title</label>
          <input
            name="title"
            [(ngModel)]="model.title"
            required
            class="form-input"
            placeholder="Give your screenshot a title..." />
        </div>

        <!-- Upload -->
        <div class="form-field">
          <label class="form-label">Screenshot</label>
          <div class="upload-area">
            <label class="upload-btn">
              <i class="material-icons">upload</i>
              Browse File
              <input
                type="file"
                style="display:none"
                (change)="onFileChange($event)"
                accept="image/*" />
            </label>
            @if (selectedFile; as sf) {
              <span class="upload-filename">
                <i class="material-icons">image</i>
                {{ sf.name }}
              </span>
            }
          </div>
        </div>

        <!-- Content -->
        <div class="form-field">
          <label class="form-label">Description</label>
          <textarea
            name="content"
            [(ngModel)]="model.content"
            rows="5"
            class="form-textarea"
            placeholder="Describe your screenshot...">
          </textarea>
        </div>

        <!-- Submit -->
        <div class="form-actions">
          <button type="submit" class="submit-btn">
            <i class="material-icons">upload</i>
            Submit Screenshot
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
