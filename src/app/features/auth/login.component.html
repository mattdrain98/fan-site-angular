<div class="login-page">
  <div class="login-wrapper">

    <div class="login-header-bar">
      <div class="login-header-left">
        <i class="material-icons">login</i>
        <span>Sign In</span>
      </div>
    </div>

    <div class="login-card">

      <p class="login-subheading">Welcome back! Sign in to continue to your community.</p>

      <!-- Errors -->
      @if (errors?.length) {
        <div class="login-errors">
          @for (e of errors; track e) {
            <div class="error-item">
              <i class="material-icons">error_outline</i>
              {{ e }}
            </div>
          }
        </div>
      }

      <!-- Email unconfirmed -->
      @if (emailUnconfirmed) {
        <div class="login-errors">
          <div class="error-item">
            <i class="material-icons">error_outline</i>
            Please confirm your email before logging in.
          </div>
          <button class="submit-btn" style="margin-top:.75rem" (click)="resendConfirmation()">
            <i class="material-icons">send</i>
            Resend Confirmation Email
          </button>
        </div>
      }

      <form #f="ngForm" (ngSubmit)="submit(f)" novalidate>

        <div class="form-field">
          <label class="form-label" for="userName">Username</label>
          <input
            id="userName"
            name="userName"
            [(ngModel)]="model.userName"
            required
            class="form-input"
            placeholder="Enter your username"
            autocomplete="username" />
        </div>

        <div class="form-field">
          <div class="form-label-row">
            <label class="form-label" for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <input
            id="password"
            name="password"
            [(ngModel)]="model.password"
            required
            type="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password" />
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input
              name="rememberMe"
              [(ngModel)]="model.rememberMe"
              type="checkbox"
              class="checkbox-input" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-text">Keep me signed in</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" [disabled]="f.invalid">
            <i class="material-icons">login</i>
            Sign In
          </button>
        </div>

      </form>

      <p class="login-prompt">
        Don't have an account? <a class="login-link" routerLink="/register">Create one</a>
      </p>

    </div>
  </div>
</div>
